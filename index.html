<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0E0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NMW">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F0E0C'/%3E%3Ctext x='32' y='41' font-family='Georgia' font-size='22' fill='%23C9A24B' text-anchor='middle'%3ENMW%3C/text%3E%3C/svg%3E">
<title>NMW Frangolinos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}
:root{
color-scheme: dark;
--bg:#0F0E0C;
--card:#181613;
--card-2:#201D19;
--line:#2C2823;
--line-soft:#221F1B;
--gold:#C9A24B;
--gold-soft:rgba(201,162,75,.14);
--gold-dim:#8A6E33;
--text:#EDE7DC;
--muted:#948C80;
--faint:#6A6358;
--ok:#86A872;
--ok-soft:rgba(134,168,114,.14);
--sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--serif:'Fraunces',Georgia,'Times New Roman',serif;
--r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
margin:0;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;
padding-inline:16px;
padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:600px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{padding-top:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mark{font-family:var(--serif);font-size:.78rem;letter-spacing:.24em;color:var(--gold);margin:0}
.top h1{font-family:var(--serif);font-weight:400;font-size:1.7rem;line-height:1.1;margin:.2rem 0 0;text-wrap:balance}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.who small{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.who select{
appearance:none;-webkit-appearance:none;background:var(--card);border:1px solid var(--line);
color:var(--text);border-radius:999px;padding:.42rem 2rem .42rem .9rem;font-weight:700;font-size:.9rem;
background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;
}
.sticky{
position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line-soft);
}
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rail button{
background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.45rem 0 .4rem;
display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;
}
.rail b{font-size:.8rem;font-weight:800;letter-spacing:.04em}
.rail i{font-style:normal;font-size:.62rem;color:var(--faint);white-space:nowrap}
.rail .dt{font-size:.66rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.rail button[aria-selected="true"] .dt{color:#4A3B17}
.rail button.today:not([aria-selected="true"]){border-color:var(--gold-dim)}
.rail button.empty:not([aria-selected="true"]){opacity:.45}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.wknav span{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.wknav span em{font-style:normal;color:var(--gold)}
.wknav button{background:var(--card);border:1px solid var(--line);border-radius:8px;width:34px;height:28px;color:var(--text);font-size:1rem;line-height:1}
.wknav button[disabled]{opacity:.3}
.fillall{display:flex;justify-content:flex-end;margin-top:10px}
.fillall button{background:none;border:1px solid var(--gold-dim);color:var(--gold);border-radius:8px;padding:.35rem .75rem;font-size:.76rem;font-weight:800}
.fillall button.undo{border-color:var(--line);color:var(--muted)}
.vid{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:.76rem;font-weight:700;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:.22rem .7rem .22rem .5rem;background:var(--card-2)}
.vid svg{width:14px;height:14px;fill:currentColor}
.board{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.boardbtn{background:none;border:0;padding:0;color:var(--gold);font-weight:800;font-size:.8rem;display:flex;align-items:center;gap:6px}
.boardbtn small{color:var(--faint);font-weight:600}
.boardbody{margin-top:8px;display:grid;gap:10px}
.metric h5{margin:0 0 4px;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rank{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;font-size:.84rem;padding:3px 0;border-bottom:1px solid var(--line-soft)}
.rank .pos{color:var(--faint);font-weight:800}
.rank.p1 .pos{color:var(--gold)}
.rank .nm{color:var(--text)}
.rank.me .nm{color:var(--gold);font-weight:800}
.rank .val{font-weight:700;text-align:right}
.rank .val small{display:block;font-weight:500;color:var(--faint);font-size:.7rem}
.boardempty{font-size:.8rem;color:var(--faint)}
.scales{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:14px}
.scale label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.84rem;font-weight:700}
.scale label small{display:block;font-weight:500;color:var(--faint);font-size:.72rem}
.scale label b{font-size:1.2rem;color:var(--gold);min-width:2.2em;text-align:right}
.scale input[type=range]{width:100%;accent-color:#C9A24B;margin-top:6px}
.scale.unset input[type=range]{opacity:.45}
.scale .ends{display:flex;justify-content:space-between;font-size:.66rem;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:800;font-size:.84rem;padding:.6rem 1rem;border-radius:999px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.rail button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#17130B}
.rail button[aria-selected="true"] i{color:#4A3B17}
.rail button.done:not([aria-selected="true"]) i{color:var(--ok)}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 0 6px}
.dayhead .eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
.dayhead h2{font-family:var(--serif);font-weight:400;font-size:1.45rem;line-height:1.15;margin:.15rem 0 0;text-wrap:balance}
.ring{flex:none;width:58px;height:58px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-weight:700}
.daynote{color:var(--muted);font-size:.86rem;margin:.2rem 0 0;max-width:62ch}
.blocks{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bhead{
width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;
padding:12px 14px;background:none;border:0;text-align:left;
}
.letter{
width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
font-family:var(--serif);font-size:1.05rem;color:var(--gold);background:var(--gold-soft);
}
.block.complete .letter{color:var(--ok);background:var(--ok-soft)}
.bhead h3{margin:0;font-size:.98rem;font-weight:700;line-height:1.25}
.bhead .meta{display:block;font-size:.76rem;color:var(--muted);font-weight:500;margin-top:1px}
.bcount{font-size:.76rem;color:var(--faint);display:flex;align-items:center;gap:8px}
.chev{width:9px;height:9px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
.block.closed .chev{transform:rotate(-45deg);margin-top:0}
.bbody{padding:0 14px 14px;border-top:1px solid var(--line-soft)}
.block.closed .bbody{display:none}
.intro{font-size:.84rem;color:var(--muted);margin:12px 0 0;max-width:62ch}
.grp{margin-top:12px}
.glabel{
display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
color:var(--gold);margin:0 0 2px;
}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.items li:last-child .item{border-bottom:0}
.item input[type=checkbox]{
appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:1px 0 0;border-radius:6px;
border:1.5px solid var(--faint);background:transparent;display:grid;place-items:center;cursor:pointer;
}
.item input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
.item input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid #10140D;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .t{font-weight:600;font-size:.95rem}
.item.checked .t{color:var(--muted)}
.item .d{display:block;font-size:.8rem;color:var(--muted);font-weight:400;margin-top:2px;max-width:62ch}
.item .d a{color:var(--gold)}
.rest{display:inline-block;margin-top:4px;font-size:.74rem;color:var(--faint);font-weight:600}
.loads{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.load{
background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;
display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;
}
.load b{font-size:.92rem;color:var(--gold);font-weight:700}
.load small{font-size:.66rem;color:var(--faint);letter-spacing:.02em}
.loadbase{flex-basis:100%;font-size:.7rem;color:var(--faint)}
.missing{font-size:.76rem;color:var(--muted);margin-top:6px;border:1px dashed var(--line);border-radius:8px;padding:6px 9px}
.missing button{background:none;border:0;color:var(--gold);font-weight:700;padding:0;text-decoration:underline}
.note{
margin-top:8px;font-size:.8rem;padding:7px 10px;border-radius:8px;
background:var(--card-2);border:1px solid var(--line);color:var(--muted);
}
.note b{color:var(--text)}
.note.mine{border-color:var(--gold-dim);background:var(--gold-soft);color:var(--text)}
.note.mine b{color:var(--gold)}
.log{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.log label{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:10px;font-size:.8rem;color:var(--muted)}
.log input,.field input{
width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;font-size:.9rem;
}
.log input:focus,.field input:focus{border-color:var(--gold-dim);outline:none}
.actions{display:flex;justify-content:center;margin:22px 0 4px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:.5rem 1.1rem;color:var(--muted);font-size:.82rem}
.restday{padding:38px 8px;text-align:center;color:var(--muted)}
.restday p{font-family:var(--serif);font-size:1.5rem;color:var(--text);margin:0 0 .3rem}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{
flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.4rem .85rem;
font-size:.8rem;font-weight:700;color:var(--muted);
}
.seg button[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tests{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.test{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.test header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.test h4{margin:0;font-size:.95rem;font-weight:700}
.test h4 small{display:block;font-weight:500;color:var(--faint);font-size:.74rem}
.fill{font-size:.72rem;color:var(--faint);white-space:nowrap}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;padding:4px 0;border-bottom:1px solid var(--line-soft)}
.row span{color:var(--muted)}
.row em{font-style:normal;font-weight:700;text-align:right}
.row.empty em{color:var(--faint);font-weight:400}
.row.me{border-bottom-color:var(--gold-dim)}
.row.me span{color:var(--gold);font-weight:700}
.mybest{margin-top:8px;font-size:.78rem;color:var(--muted)}
.profile{margin-top:18px}
.profile h2{font-family:var(--serif);font-weight:400;font-size:1.9rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.stat b{font-size:1.15rem}
.sect{margin-top:22px}
.sect h3{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:800}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.field{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:4px}
.field span{font-size:.76rem;color:var(--muted)}
.field .in{display:flex;align-items:center;gap:6px}
.field .in small{color:var(--faint);font-size:.74rem}
.field.edited{border-color:var(--gold-dim)}
.hint{font-size:.78rem;color:var(--faint);margin-top:8px}
.tabs{
position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(15,14,12,.96);
border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{background:none;border:0;border-radius:10px;padding:.5rem 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:.72rem;font-weight:700;letter-spacing:.04em}
.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--gold)}
@media (max-width:380px){
.rail i{display:none}
.stats{grid-template-columns:repeat(2,1fr)}
.fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sync{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--faint);margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--ok)} .dot.busy{background:var(--gold)} .dot.off{background:#B5654A}
.row .edit{background:none;border:0;padding:0;font-weight:700;color:var(--gold);text-align:right;display:flex;gap:6px;align-items:center}
.row .edit svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.editor{display:flex;gap:6px;grid-column:1/-1;padding:6px 0}
.editor input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--gold-dim);border-radius:8px;padding:.45rem .6rem;font-size:.9rem}
.btn{background:var(--gold);color:#17130B;border:0;border-radius:8px;padding:.45rem .9rem;font-weight:800;font-size:.82rem}
.btn[disabled]{opacity:.5}
.btn.sec{background:none;color:var(--muted);border:1px solid var(--line)}
.login{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:16px}
.login p{margin:0 0 10px;font-size:.84rem;color:var(--muted)}
.login .in{display:flex;gap:8px}
.login input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;font-size:1rem;letter-spacing:.3em}
.err{color:#D98A6E;font-size:.8rem;margin-top:8px}
.banner{margin-top:14px;font-size:.8rem;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.banner b{color:var(--gold)}
.field input[readonly]{border-color:transparent;background:transparent;padding-left:0}
.sets{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,.8fr) minmax(0,.9fr);gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.srow.h{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800;padding-block:7px;background:var(--card-2)}
.srow .sn{font-size:.78rem;color:var(--muted);font-weight:700}
.srow input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:.38rem .5rem;font-size:.92rem;text-align:center}
.srow input:focus{border-color:var(--gold-dim);outline:none}
.srow input::placeholder{color:var(--faint)}
.srow .sv{text-align:right;font-size:.82rem;color:var(--muted)}
.sfoot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;background:var(--card-2)}
.sfoot .mini{background:none;border:1px solid var(--line);border-radius:7px;padding:.28rem .6rem;font-size:.74rem;color:var(--muted);font-weight:700}
.sfoot .mini.gold{color:var(--gold);border-color:var(--gold-dim)}
.sfoot .tot{margin-left:auto;font-size:.8rem;color:var(--muted)}
.sfoot .tot b{color:var(--gold);font-size:.95rem}
.dayvol{margin:.35rem 0 0;font-size:.82rem;color:var(--muted)}
.dayvol b{color:var(--gold)}
.comment{margin-top:12px;display:grid;gap:4px}
.comment span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800}
.comment textarea{width:100%;min-height:52px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;font:inherit;font-size:.88rem;color:var(--text)}
.comment textarea:focus{border-color:var(--gold-dim);outline:none}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;background:#1F6F4A;color:#F2FFF7;border:0;border-radius:12px;padding:.85rem 1rem;font-weight:800;font-size:.95rem;text-decoration:none}
.wa svg{width:20px;height:20px;fill:currentColor}
.wahint{text-align:center;font-size:.74rem;color:var(--faint);margin:.5rem 0 0}
[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .box{width:100%;max-width:340px;text-align:center}
.gate h1{font-family:var(--serif);font-weight:400;font-size:2rem;margin:.3rem 0 .4rem}
.gate p{color:var(--muted);font-size:.9rem;margin:0 0 22px}
.gate input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;font-size:1.6rem;letter-spacing:.5em;text-align:center;color:var(--text)}
.gate input:focus{border-color:var(--gold-dim);outline:none}
.gate .btn{width:100%;margin-top:12px;padding:.85rem;font-size:1rem;border-radius:12px}
.gate .err{min-height:1.2em}
.gate .mark{color:var(--gold);margin:0}
.me-name{font-weight:800;font-size:1rem;color:var(--text)}
.me-out{background:none;border:0;padding:0;color:var(--faint);font-size:.72rem;text-decoration:underline}
</style>
</head>
<body>
<div class="gate" id="gate" hidden><form class="box" data-gate="1"><p class="mark">NO MATTER WHAT</p><h1>Frangolinos</h1><p>Digite seu PIN para entrar.</p><input id="gatePin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••" aria-label="PIN"><button class="btn" type="submit">Entrar</button><div class="err" id="gateErr"></div></form></div>
<div class="wrap">
<div class="top">
<div>
<p class="mark">NO MATTER WHAT</p>
<h1>Frangolinos</h1>

}
function boardInner(day,bi){
var b=day.blocks[bi], h='', any=false, me=S.auth&&S.auth.athlete;
function rows(list){ return list.map(function(r,i){ return '<div class="rank'+(i===0?' p1':'')+(r.a===me?' me':'')+'"><span class="pos">'+(i+1)+'º</span><span class="nm">'+esc(r.a)+'</span><span class="val">'+r.html+'</span></div>'; }).join(''); }
blockGroups(b).forEach(function(g,gi){ g.items.forEach(function(it,ii){
var k=bi+'.'+gi+'.'+ii;
if(it.sets){ var L=boardEntries(day.id,'S'+k).map(function(r){ var o={}; try{o=JSON.parse(r.v)}catch(e){} return {a:r.a,top:+o.top||0,html:(o.top||'–')+' lb<small>vol '+fmtN(o.vol||0)+' · '+esc(o.s||'')+'</small>'}; }).filter(function(r){return r.top}).sort(function(x,y){return y.top-x.top});
if(L.length){ any=true; h+='<div class="metric"><h5>'+esc(shortName(it.t))+' · maior carga</h5>'+rows(L)+'</div>'; } }
else if(it.log){ var L2=boardEntries(day.id,'I'+k).map(function(r){ var p=parseRank(r.v); return {a:r.a,p:p,html:esc(r.v)}; }).sort(cmpRank);
if(L2.length){ any=true; h+='<div class="metric"><h5>'+esc(shortName(it.t))+'</h5>'+rows(L2)+'</div>'; } }
}); });
(b.logs||[]).forEach(function(lab,li){
var L3=boardEntries(day.id,'L'+bi+'.'+li).map(function(r){ var p=parseRank(r.v); return {a:r.a,p:p,html:esc(r.v)}; }).sort(cmpRank);
if(L3.length){ any=true; h+='<div class="metric"><h5>'+esc(lab)+'</h5>'+rows(L3)+'</div>'; }
});
return any?h:'<p class="boardempty">Ninguém anotou ainda hoje. Os resultados aparecem aqui conforme os atletas preenchem.</p>';
}
function cmpRank(x,y){ if(x.p.t!==y.p.t) return x.p.t-y.p.t; return x.p.t===0?x.p.n-y.p.n:y.p.n-x.p.n; }
function boardShell(day,bi){
var key=day.id+'.'+bi, open=!!OPENB[key];
if(open) loadRes(day.id,false);
return '<div class="board" data-board="'+key+'"><button type="button" class="boardbtn" data-boardt="'+key+'" aria-expanded="'+open+'">🏆 Ranking do dia <small>'+(open?'ocultar':'ver')+'</small></button><div class="boardbody"'+(open?'':' hidden')+'>'+(open?boardInner(day,bi):'')+'</div></div>';
}
function refreshBoards(date){
if(S.tab!=='treino' || S.day!==date) return;
var day=dayFor(date);
document.querySelectorAll('.board[data-board]').forEach(function(el){ var k=el.dataset.board; if(!OPENB[k]) return; var bi=+k.split('.')[1]; el.querySelector('.boardbody').innerHTML=boardInner(day,bi); });
}
var EDITING=null; // nome do teste em edição
var PEN='<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
function loginHTML(){
if(!API_URL) return '<div class="banner">Edição desligada: o app ainda não foi ligado à planilha (API_URL vazio).</div>';
if(isMe()) return '';
if(S.auth) return '<div class="banner">Visualizando <b>'+esc(S.athlete)+'</b> (somente leitura).</div>';
return '<div class="login"><p>É o <b>'+esc(S.athlete)+'</b>? Digite seu PIN para editar seus resultados.</p>'+
'<form class="in" data-login="1"><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="PIN" aria-label="PIN"><button class="btn" type="submit">Entrar</button></form><div class="err" id="loginErr" hidden></div></div>';
}
function renderTestes(){
var h='<div class="sticky"><div class="seg" role="tablist" aria-label="Categorias de teste">';
TESTS.forEach(function(c){ h+='<button role="tab" data-cat="'+esc(c.cat)+'" aria-selected="'+(c.cat===S.cat)+'">'+esc(c.cat)+'</button>'; });
h+='</div></div>';
var cat=TESTS.filter(function(c){return c.cat===S.cat})[0]||TESTS[0];
h+='<div class="dayhead"><div><p class="eyebrow">Testes e PRs</p><h2>'+esc(cat.cat)+'</h2></div></div>';
h+=loginHTML();
h+='<div class="tests">';
var me=isMe();
cat.items.forEach(function(t){
var who=ATHLETES.slice();
var filled=who.filter(function(a){return t.v[a]}).length;
h+='<article class="test"><header><h4>'+esc(t.n)+(t.s?'<small>'+esc(t.s)+'</small>':'')+'</h4><span class="fill num">'+filled+'/'+who.length+'</span></header><div class="rows num">';
who.forEach(function(a){
var v=t.v[a], mine=a===S.athlete;
var shown=v?esc(v)+(t.u&&/^\d+([.,]\d+)?$/.test(v)?' '+esc(t.u):''):'—';
if(mine && me){
if(EDITING===t.n){
h+='<form class="editor" data-save="'+esc(t.n)+'"><input id="ed" value="'+esc(v||'')+'" placeholder="'+(t.u==='lb'?'ex.: 255':'ex.: 2:24 ou 45')+'" autocomplete="off" maxlength="60"><button class="btn" type="submit">Salvar</button><button class="btn sec" type="button" data-cancel="1">×</button></form>';
} else {
h+='<div class="row me"><span>'+esc(a)+'</span><button type="button" class="edit" data-edit="'+esc(t.n)+'">'+(v?shown:'adicionar')+PEN+'</button></div>';
}
} else {
h+='<div class="row'+(v?'':' empty')+(mine?' me':'')+'"><span>'+esc(a)+'</span><em>'+shown+'</em></div>';
}
});
h+='</div><div class="err" data-errfor="'+esc(t.n)+'" hidden></div></article>';
});
h+='</div>';
document.getElementById('view-testes').innerHTML=h;
var ed=document.getElementById('ed'); if(ed){ ed.focus(); ed.select(); }
}
function renderAtleta(){
var a=S.athlete, total=0, mine=0, me=isMe();
TESTS.forEach(function(c){ c.items.forEach(function(t){ total++; if(t.v[a]) mine++; }); });
var css=(findTest('CSS natação')||{v:{}}).v[a]||'—';
var wk=0,wt=0; weekDays(THIS_MON).forEach(function(d){var p=dayProgress(d); wk+=p.d; wt+=p.t;});
var h='<div class="profile"><p class="eyebrow" style="font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0">Perfil do atleta</p><h2>'+esc(a)+'</h2>';
h+='<div class="stats num"><div class="stat"><small>Semana</small><b>'+(wt?Math.round(wk/wt*100):0)+'%</b></div><div class="stat"><small>Testes feitos</small><b>'+mine+'/'+total+'</b></div><div class="stat"><small>CSS natação</small><b>'+esc(css)+'</b></div></div>';
h+=loginHTML();
h+='<div class="sect"><h3>1RMs usados nas cargas (lb)</h3><div class="fields">';
BASE_ORDER.forEach(function(k){
var t=testForKey(k); if(!t) return;
var v=t.v[a]||'';
h+='<div class="field"><span>'+BASES[k].n+'</span><div class="in"><input id="m-'+k+'" data-max="'+esc(t.n)+'" inputmode="decimal" value="'+esc(v)+'" placeholder="—" aria-label="1RM '+BASES[k].n+'"'+(me?'':' readonly')+'><small>lb</small></div></div>';
});
h+='</div><p class="hint">'+(me?'Altere e saia do campo para salvar na planilha. As cargas da semana recalculam na hora.':'Os valores vêm da planilha de testes. Para alterar, entre com seu PIN.')+'</p><div class="err" id="maxErr" hidden></div></div></div>';
document.getElementById('view-atleta').innerHTML=h;
}
function render(){
['treino','testes','atleta'].forEach(function(t){ document.getElementById('view-'+t).hidden = t!==S.tab; });
document.querySelectorAll('.tabs button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab===S.tab)); });
if(S.tab==='treino') renderTreino();
if(S.tab==='testes') renderTestes();
if(S.tab==='atleta') renderAtleta();
syncUI();
}
var sel=document.getElementById('athlete');
function fillAthletes(){
sel.innerHTML='';
ATHLETES.forEach(function(a){ var o=document.createElement('option'); o.value=a; o.textContent=a; sel.appendChild(o); });
if(ATHLETES.indexOf(S.athlete)<0) S.athlete=ATHLETES[0];
sel.value=S.athlete;
}
var COACH='João';
function applyAuth(){
var g=document.getElementById('gate'), a=S.auth;
g.hidden=!!a;
if(!a){ setTimeout(function(){ var p=document.getElementById('gatePin'); if(p) p.focus(); },50); return; }
var coach=a.athlete===COACH;
if(!coach || ATHLETES.indexOf(S.athlete)<0) S.athlete=a.athlete;
sel.hidden=!coach; sel.value=S.athlete;
document.getElementById('meName').textContent=coach?'':a.athlete;
document.getElementById('meName').hidden=coach;
}
fillAthletes();
applyAuth();
sel.addEventListener('change',function(){ S.athlete=sel.value; EDITING=null; save(); render(); });
document.querySelector('.tabs').addEventListener('click',function(e){
var b=e.target.closest('button[data-tab]'); if(!b) return;
S.tab=b.dataset.tab; EDITING=null; save(); render(); window.scrollTo(0,0);
});
function showErr(el,msg){ if(!el) return; el.textContent=msg; el.hidden=false; }
document.addEventListener('click',function(e){
var t;
if((t=e.target.closest('[data-wk]'))){ S.day=addDays(mondayOf(S.day),+t.dataset.wk); var nm=mondayOf(S.day); if(nm===THIS_MON) S.day=TODAY; save(); render(); return; }
if((t=e.target.closest('[data-day]'))){ S.day=t.dataset.day; save(); render(); window.scrollTo(0,0); return; }
if((t=e.target.closest('[data-cat]'))){ S.cat=t.dataset.cat; EDITING=null; save(); render(); return; }
if((t=e.target.closest('[data-toggle]'))){ var k=t.dataset.toggle; var sec=t.parentNode; var closed=!sec.classList.contains('closed'); S.closed[k]=closed; sec.classList.toggle('closed',closed); t.setAttribute('aria-expanded',String(!closed)); save(); return; }
if((t=e.target.closest('[data-goto]'))){ S.tab=t.dataset.goto; save(); render(); window.scrollTo(0,0); return; }
if((t=e.target.closest('[data-reset]'))){
var d=t.dataset.reset, c=ck(); Object.keys(c).forEach(function(k){ if(k.indexOf(d+'.')===0) delete c[k]; }); save(); render(); return;
}
if((t=e.target.closest('[data-wa]'))){
var dd=dayFor(t.dataset.wa), txt=summary(dd);
syncDay(dd.id); flushRes();
copyText(txt).then(function(ok){ toast(ok?'Resumo copiado — é só colar no grupo':'Resumo pronto no WhatsApp'); });
window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank','noopener'); return;
}
if((t=e.target.closest('[data-boardt]'))){
var bk=t.dataset.boardt; OPENB[bk]=!OPENB[bk]; var bw=t.parentNode, bd=bw.querySelector('.boardbody');
t.setAttribute('aria-expanded',String(OPENB[bk])); t.querySelector('small').textContent=OPENB[bk]?'ocultar':'ver';
bd.hidden=!OPENB[bk]; if(OPENB[bk]){ var bdate=bk.split('.')[0]; bd.innerHTML=boardInner(dayFor(bdate),+bk.split('.')[1]); loadRes(bdate,true); }
return;
}
if((t=e.target.closest('[data-fillall]'))){
var fp=t.dataset.fillall.split('.'), fday=dayFor(fp[0]), fb=fday.blocks[+fp[1]], fids=[], fc=ck();
blockGroups(fb).forEach(function(g,gi){ g.items.forEach(function(it,ii){ fids.push(fday.id+'.'+fp[1]+'.'+gi+'.'+ii); }); });
var all=fids.every(function(x){return fc[x]});
fids.forEach(function(x){ if(all) delete fc[x]; else fc[x]=1; });
save(); var yf=window.scrollY; renderTreino(); window.scrollTo(0,yf); return;
}
if((t=e.target.closest('[data-fill]'))){
var fid=t.dataset.fill, fit=findItem(fid), arr=getSets(fit,fid).map(function(x){return {w:x.w,r:x.r}});
arr.forEach(function(x,i){ var tg=targetFor(fit,i,arr.length); if(tg) x.w=String(tg); if(!x.r) x.r=String(plannedReps(fit,i)); });
st()[fid]=arr; save(); syncDay(fid.split('.')[0]); var y1=window.scrollY; renderTreino(); window.scrollTo(0,y1); return;
}
if((t=e.target.closest('[data-addset]'))){
var aid=t.dataset.addset, ait=findItem(aid), a2=getSets(ait,aid).slice(); var last=a2[a2.length-1]||{w:'',r:''};
a2.push({w:last.w,r:last.r}); st()[aid]=a2; save(); syncDay(aid.split('.')[0]); var y2=window.scrollY; renderTreino(); window.scrollTo(0,y2); return;
}
if((t=e.target.closest('[data-delset]'))){
var did=t.dataset.delset, dit=findItem(did), a3=getSets(dit,did).slice(); a3.pop(); st()[did]=a3; save(); syncDay(did.split('.')[0]); var y3=window.scrollY; renderTreino(); window.scrollTo(0,y3); return;
}
if((t=e.target.closest('[data-edit]'))){ EDITING=t.dataset.edit; renderTestes(); return; }
if((t=e.target.closest('[data-cancel]'))){ EDITING=null; renderTestes(); return; }
if((t=e.target.closest('[data-logout]'))){ S.auth=null; EDITING=null; save(); applyAuth(); render(); return; }
});
document.addEventListener('submit',function(e){
var f=e.target;
if(f.dataset.gate){
e.preventDefault();
var gp=document.getElementById('gatePin'), gpin=gp.value.trim(), gerr=document.getElementById('gateErr'), gb=f.querySelector('button');
if(!gpin){ gerr.textContent='Digite seu PIN.'; return; }
gb.disabled=true; gb.textContent='Entrando…'; gerr.textContent='';
api({action:'pin',pin:gpin}).then(function(d){
gb.disabled=false; gb.textContent='Entrar';
if(d.ok){ S.auth={athlete:d.athlete,pin:gpin}; S.athlete=d.athlete; gp.value=''; save(); applyAuth(); render(); pull(); }
else { gerr.textContent=d.error||'PIN não encontrado.'; gp.select(); }
},function(){ gb.disabled=false; gb.textContent='Entrar'; gerr.textContent='Sem conexão. Tente de novo.'; });
return;
}
if(f.dataset.login){
e.preventDefault();
var pin=document.getElementById('pin').value.trim(), err=document.getElementById('loginErr'), btn=f.querySelector('button');
if(!pin){ showErr(err,'Digite seu PIN.'); return; }
btn.disabled=true; btn.textContent='…';
api({action:'login',athlete:S.athlete,pin:pin}).then(function(d){
if(d.ok){ S.auth={athlete:S.athlete,pin:pin}; save(); render(); }
else { btn.disabled=false; btn.textContent='Entrar'; showErr(err,d.error||'PIN incorreto.'); }
},function(){ btn.disabled=false; btn.textContent='Entrar'; showErr(err,'Sem conexão. Tente de novo.'); });
}
if(f.dataset.save){
e.preventDefault();
var name=f.dataset.save, val=document.getElementById('ed').value.trim(), b=f.querySelector('button[type=submit]');
b.disabled=true; b.textContent='Salvando…';
saveResult(name,val).then(function(){ EDITING=null; render(); },function(x){
b.disabled=false; b.textContent='Salvar';
showErr(document.querySelector('[data-errfor="'+CSS.escape(name)+'"]'), x.error||'Não salvou.');
});
}
});
document.addEventListener('change',function(e){
var t=e.target;
if(t.matches('input[type=checkbox][data-id]')){
var c=ck(); if(t.checked) c[t.dataset.id]=1; else delete c[t.dataset.id];
save();
var y=window.scrollY; renderTreino(); window.scrollTo(0,y);
}
if(t.dataset.max && !t.readOnly){
var name=t.dataset.max, cur=(findTest(name)||{v:{}}).v[S.athlete]||'';
if(t.value.trim()===cur) return;
t.disabled=true;
saveResult(name,t.value.trim()).then(function(){ renderAtleta(); },function(x){ t.disabled=false; showErr(document.getElementById('maxErr'),x.error||'Não salvou.'); });
}
});
document.addEventListener('input',function(e){
var t=e.target;
if(t.dataset.log){ lg()[t.dataset.log]=t.value; save(); syncDay(t.dataset.log.split('.')[0]); }
if(t.dataset.scale){ var sr=rp(t.dataset.date); sr[t.dataset.scale]=+t.value; save(); var sv=document.getElementById('scv-'+t.dataset.scale); if(sv) sv.textContent=String(t.value).replace('.',','); t.closest('.scale').classList.remove('unset'); syncDay(t.dataset.date); }
if(t.dataset.note){ nt()[t.dataset.note]=t.value; save(); }
if(t.dataset.sw || t.dataset.sr){
var ref=(t.dataset.sw||t.dataset.sr).split('|'), sid=ref[0], si=+ref[1], sit=findItem(sid);
var arr=getSets(sit,sid).map(function(x){return {w:x.w,r:x.r}});
if(t.dataset.sw) arr[si].w=t.value; else arr[si].r=t.value;
st()[sid]=arr; save(); refreshVol(sid); syncDay(sid.split('.')[0]);
}
});
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ pull(); if(S.tab==='treino') loadRes(S.day,true); } else if(Object.keys(RESQ).length){ flushRes(); } });
var APP_VER='2026-09-20c';
(function checkVer(){ try{ fetch(location.pathname+'?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){ var m=t.match(/var APP_VER='([^']+)'/); if(m && m[1]!==APP_VER){ location.replace(location.pathname+'?v='+m[1]); } }).catch(function(){}); }catch(e){} })();
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ fetch(location.pathname+'?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){ var m=t.match(/var APP_VER='([^']+)'/); if(m && m[1]!==APP_VER) location.replace(location.pathname+'?v='+m[1]); }).catch(function(){}); } });
render();
pull();
if(S.auth && API_URL){ api({action:'login',athlete:S.auth.athlete,pin:S.auth.pin}).then(function(d){ if(!d.ok){ S.auth=null; save(); applyAuth(); render(); } },function(){}); }
</script>
</body>
